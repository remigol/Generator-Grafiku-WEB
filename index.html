<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generator Grafiku WEB</title><style>
:root{font-family:system-ui,Arial;background:#f4f7fb;color:#16243a}body{margin:0}header{background:#17324e;color:white;padding:18px 22px}main{max-width:1200px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #17324e15}button,input{padding:9px;border-radius:8px;border:1px solid #cbd5e1}button{background:#17324e;color:white;cursor:pointer;margin:3px}button.secondary{background:#e8eef6;color:#17324e}label{display:inline-flex;gap:7px;align-items:center;margin:5px}input[type=number]{width:80px}table{border-collapse:collapse;font-size:13px;white-space:nowrap}td,th{border:1px solid #d9e0e9;padding:6px;text-align:center}th{background:#e8eef6}td:first-child,th:first-child{position:sticky;left:0;background:#e8eef6;font-weight:bold}td.shift{cursor:pointer;min-width:27px}td.day{background:#ccefe0}td.night{background:#d7e5ff}td.locked{outline:2px solid #d58d16;outline-offset:-2px}td.closed{background:#f0e5f8}td.sat{background:#fff1cc}.scroll{overflow:auto}#message{white-space:pre-wrap}small{color:#60738a}
</style></head><body><header><h2>📅 Generator Grafiku WEB</h2><small style="color:#dce6f0">9 pracowników • produkcja A–F • pakowanie G–I</small></header><main>
<section class="panel"><label>Rok <input id="year" type="number" min="2024" max="2100"></label><label>Miesiąc <input id="month" type="number" min="1" max="12"></label><label>Nominał (h) <input id="nominal" type="number" min="0" step="8" value="176"></label><label>Dni zamknięte <input id="closed" placeholder="np. 4, 12" style="width:110px"></label><div><button onclick="generate()">⚡ GENERUJ</button><button class="secondary" onclick="undo()">↶ COFNIJ</button><button class="secondary" onclick="validate()">Sprawdź</button><button onclick="exportXlsx()">⬇ Eksport XLSX</button><button class="secondary" onclick="save()">Zapisz JSON</button><button class="secondary" onclick="document.getElementById('load').click()">Wczytaj JSON</button><input type="file" id="load" accept=".json" hidden onchange="loadFile(event)"></div><small>Kliknij komórkę, aby zmienić: wolne → 6 → 18 → W → wolne. Ręczne wpisy są blokowane podczas generowania.</small></section>
<section class="panel"><div class="scroll" id="grid"></div></section><section class="panel"><h3>Podsumowanie</h3><div class="scroll" id="summary"></div></section><section class="panel"><h3>Kontrola zasad</h3><div id="message">Wybierz miesiąc i wygeneruj grafik.</div></section></main><script>
const PEOPLE=[...'ABCDEFGHI'];const now=new Date();year.value=now.getFullYear();month.value=now.getMonth()+1;let schedule={},locks={},days=[],history=[];
function nDays(){return new Date(+year.value,+month.value,0).getDate()}
function blank(){let n=nDays();schedule=Object.fromEntries(PEOPLE.map(p=>[p,Array(n).fill('')]));locks={};days=Array.from({length:n},(_,i)=>({day:i+1,weekday:(new Date(+year.value,+month.value-1,i+1).getDay()+6)%7,type:'weekday'}));render()}
function payload(){return {year:+year.value,month:+month.value,nominal:+nominal.value,closed:closed.value.split(',').map(x=>+x.trim()).filter(Boolean),schedule,locks}}
function snapshot(){history.push(JSON.stringify({schedule,locks,days}));if(history.length>30)history.shift()}
function undo(){if(!history.length)return;({schedule,locks,days}=JSON.parse(history.pop()));render()}
function edit(p,d){snapshot();let key=p+'-'+(d+1),old=schedule[p][d],next={'':'6','6':'18','18':'W','W':''}[old];schedule[p][d]=next; if(next)locks[key]=next;else delete locks[key];render()}
function render(){let html='<table><thead><tr><th>Osoba</th>'+days.map(d=>'<th>'+d.day+'<br>'+['Pn','Wt','Śr','Cz','Pt','So','Nd'][d.weekday]+'</th>').join('')+'</tr></thead><tbody>';for(let p of PEOPLE){html+='<tr><td>'+p+'</td>'+schedule[p].map((v,i)=>'<td onclick="edit(\''+p+'\','+i+')" class="shift '+(v==='6'?'day':v==='18'?'night':days[i].type==='closed'?'closed':days[i].type==='sat'?'sat':'')+(locks[p+'-'+(i+1)]?' locked':'')+'">'+(v||'·')+'</td>').join('')+'</tr>'}grid.innerHTML=html+'</tbody></table>';summary.innerHTML='<table><tr><th>Osoba</th><th>Godziny</th><th>6</th><th>18</th><th>Nadgodziny</th></tr>'+PEOPLE.map(p=>{let v=schedule[p],h=v.filter(x=>x==='6'||x==='18').length*12;return '<tr><td>'+p+'</td><td>'+h+'</td><td>'+v.filter(x=>x==='6').length+'</td><td>'+v.filter(x=>x==='18').length+'</td><td>'+ (h-(+nominal.value))+'</td></tr>'}).join('')+'</table>'}
async function request(path){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});if(path==='/api/export'&&r.ok)return r.blob();let j=await r.json();if(!r.ok)throw Error((j.error||'Błąd')+'\n'+(j.issues||[]).join('\n'));return j}
async function generate(){message.textContent='Generowanie…';try{let r=await request('/api/generate');if(!r.ok)throw Error(r.message);snapshot();schedule=r.schedule;days=r.days;for(let [key,v] of Object.entries(locks)){let [p,d]=key.split('-');schedule[p][+d-1]=v}render();message.textContent=r.message}catch(e){message.textContent=e.message}}
async function validate(){try{let r=await request('/api/validate');message.textContent=r.issues.length?r.issues.join('\n'):'Nie wykryto naruszeń sprawdzanych zasad.'}catch(e){message.textContent=e.message}}
async function exportXlsx(){try{let blob=await request('/api/export'),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Grafik_'+year.value+'_'+month.value+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){message.textContent=e.message}}
function save(){let blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='grafik.json';a.click()}
async function loadFile(e){try{let o=JSON.parse(await e.target.files[0].text());year.value=o.year;month.value=o.month;nominal.value=o.nominal;closed.value=(o.closed||[]).join(',');schedule=o.schedule;locks=o.locks||{};days=Array.from({length:nDays()},(_,i)=>({day:i+1,weekday:(new Date(+year.value,+month.value-1,i+1).getDay()+6)%7,type:'weekday'}));render()}catch(e){message.textContent=e.message}}
for(let el of [year,month])el.addEventListener('change',blank);nominal.addEventListener('change',render);blank();
</script></body></html>
