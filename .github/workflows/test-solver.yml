name: Test solver - nowe zasady
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  solver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile solver.py server.py
      - run: python -m unittest discover -s tests -p 'test_solver.py' -v
